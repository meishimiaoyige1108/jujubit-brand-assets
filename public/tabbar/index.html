<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JuJuBit Tabbar · 标签栏规范</title>
  <link rel="stylesheet" href="./pages.css">
  <style>
    @font-face{font-family:Instrument;src:url('../typography/instrument-sans-fonts/InstrumentSans-Regular.otf')}@font-face{font-family:Instrument;src:url('../typography/instrument-sans-fonts/InstrumentSans-SemiBold.otf');font-weight:600}
    :root{font-family:Instrument,'PingFang SC',sans-serif;color:#111;background:#fff;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #ff5a11;outline-offset:3px}a{color:#111;text-decoration:none}
    main{max-width:1480px;margin:auto;padding:52px 60px 80px}.eyebrow{margin-bottom:12px;color:#ff5a11;font-size:12px;font-weight:600}.hero{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:34px}.hero h1{margin:0 0 14px;font-size:34px;font-weight:600;line-height:1.25}.hero p{margin:0;color:#666;font-size:16px;line-height:1.6}.hero a{font-size:12px;font-weight:600;white-space:nowrap}.hero a:hover{color:#ff5a11}.layout{display:grid;grid-template-columns:minmax(460px,1.1fr) minmax(360px,.9fr);gap:22px;align-items:start}.panel{min-width:0;border:1px solid #e8e9eb;border-radius:22px;background:#fff;box-shadow:0 8px 30px #1c273008}.panel-head{padding:26px 28px 0}.kicker{color:#9ba0a5;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}.panel h2{margin:7px 0 0;font-size:22px;font-weight:600}.panel-head p{margin:8px 0 0;color:#8a8f95;font-size:12px;line-height:1.6}.phone-panel{grid-row:span 2}.phone-stage{height:644px;display:flex;justify-content:center;overflow:hidden;padding-top:26px}.phone-scale{width:283px;height:614px;flex:none}.phone{width:393px;height:852px;position:relative;transform:scale(.72);transform-origin:top left;overflow:hidden;border:7px solid #222;border-radius:43px;background:#fff;box-shadow:0 25px 50px #141d2733}.screen{position:absolute;inset:0;overflow:hidden;border-radius:36px;background:#fff}.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;font-size:14px;font-weight:600}.status-right{display:flex;align-items:center;gap:6px}.battery{position:relative;width:22px;height:11px;border:1px solid #555;border-radius:3px}.battery:before{content:'';position:absolute;inset:2px;background:#111;border-radius:1px}.battery img{position:absolute;left:22px;top:3px}.phone-title{height:44px;display:flex;align-items:center;padding:0 16px;font-size:16px;font-weight:600}.phone-top-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:12px 4px 0;white-space:nowrap}.phone-top-tabs::-webkit-scrollbar,.demo-tabs::-webkit-scrollbar{display:none}.text-tab{display:flex;flex:0 0 auto;flex-direction:column;align-items:center;gap:8px;padding:0 12px 4px;border:0;background:transparent;color:#000;font-size:14px;line-height:20px;white-space:nowrap}.text-tab span{width:24px;height:2px;border-radius:1px;background:transparent}.text-tab.active{font-weight:600}.text-tab.active span{background:#000}.feed{position:absolute;top:134px;bottom:0;left:0;right:0;overflow:hidden;padding:0 9px}.feed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 8px}.post{min-width:0}.post-art{height:170px;position:relative;overflow:hidden;border-radius:20px;background:radial-gradient(circle at 50% 31%,#e1e1e1,#aeaeae 60%,#7b7b7b)}.post:nth-child(n+3) .post-art{height:219px}.post-art .shadow{position:absolute;left:50%;top:147px;transform:translateX(-50%);max-width:none}.post-art .alien{position:absolute;top:0;left:50%;transform:translateX(-50%);height:180px;width:auto}.post-meta{height:24px;display:flex;align-items:center;gap:4px;margin-top:8px;font-size:14px}.avatar{width:24px;height:24px;flex:none;border-radius:50%;background-image:url('./assets/avatar.png');background-repeat:no-repeat;background-size:172px 138px;background-position:-129px -7px}.post-meta strong{font-weight:600}.likes{display:flex;align-items:center;gap:1px;margin-left:auto;color:#ff5a11}.likes img{display:block}.bottom-nav{position:absolute;z-index:2;left:0;right:0;bottom:15px;height:66px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px}.brand-mark{width:54px;height:54px;position:relative;flex:none}.brand-mark img{position:absolute;top:-5px;left:-5px}.nav-pill{position:relative;height:66px;display:flex;align-items:center;flex:1;min-width:0;padding:0 6px;border:1px solid #ffffffb8;border-radius:999px;background:#ffffffb8;box-shadow:1px 0 0 -.75px #d0d0d0,0 4px 18px 3px #e8e8e8,0 8px 15px #00000005;backdrop-filter:blur(12px)}.nav-pill button{position:relative;z-index:1;flex:1;min-width:0;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5px;border:0;border-radius:100px;background:transparent;color:#535353;font-size:12px;font-weight:400;line-height:16px}.nav-pill button.active{background:#ededed;color:#ff5a11;font-weight:600;line-height:18px}.nav-pill button img{display:block;max-width:68px;max-height:28px}.my-slot{height:28px;display:flex;align-items:center;justify-content:center}
    .phone-top-tabs,.demo-tabs{position:relative}
    .text-tab span{background:transparent!important}
    .tab-indicator{position:absolute;bottom:4px;left:0;width:24px;height:2px;border-radius:1px;background:#000;pointer-events:none;transition:transform 320ms cubic-bezier(.22,1,.36,1)}
    .nav-pill button.active{background:transparent}
    .nav-selection{position:absolute;z-index:0;top:5px;left:0;height:54px;border-radius:100px;background:#ededed;pointer-events:none;transition:transform 340ms cubic-bezier(.22,1,.36,1),width 340ms cubic-bezier(.22,1,.36,1)}
    @media(prefers-reduced-motion:reduce){.tab-indicator,.nav-selection{transition:none!important}}
    .style-body{padding:22px 28px 28px}.style-block+.style-block{margin-top:24px}.style-label{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:12px;font-weight:600}.style-label small{color:#999;font-weight:400}.demo-frame{min-height:98px;display:flex;align-items:center;overflow:hidden;border:1px solid #ededed;border-radius:16px;background:#f8f8f8}.demo-tabs{width:393px;max-width:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:#fff}.demo-tabs.center{justify-content:center;padding:0 16px}.demo-tabs.left{padding:0 4px}.demo-tabs .text-tab{padding-top:15px}.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:22px 28px 28px}.note{padding:15px;border-radius:13px;background:#f7f8f9}.note strong{display:block;font-size:18px;font-weight:600}.note span{display:block;margin-top:4px;color:#8d9398;font-size:11px}.spec-divider{height:1px;margin:0 28px;background:#eee}.helper{margin:0 28px 26px;color:#777;font-size:12px;line-height:1.6}
    .bottom-style{margin-top:28px;padding-top:24px;border-top:1px solid #eee}
    .bottom-demo-frame{display:grid;justify-items:center;gap:34px;overflow:hidden;padding:22px 8px;border:1px solid #ededed;border-radius:16px;background:#c4c4c4}
    .bottom-demo{width:347px;max-width:100%;height:66px;display:flex;align-items:center;gap:12px}
    .bottom-demo .nav-pill{width:281px;flex:1 1 auto;background:rgba(255,255,255,.7)}
    @media(max-width:850px){main{padding:40px 32px 80px}.layout{grid-template-columns:1fr}.phone-panel{grid-row:auto}.phone-stage{height:650px}}@media(max-width:620px){main{padding:28px 24px 40px}.hero{display:block}.hero h1{font-size:28px}.hero a{display:inline-block;margin-top:18px}.layout{gap:14px}.panel{border-radius:18px}.panel-head,.style-body{padding-left:18px;padding-right:18px}.phone-stage{height:600px}.phone-scale{width:260px;height:565px}.phone{transform:scale(.66)}.notes{padding-left:18px;padding-right:18px}.spec-divider{margin:0 18px}.helper{margin-left:18px;margin-right:18px}}

.hero h1{font-size:36pt}
@media(max-width:620px){.hero h1{font-size:16pt}}
    .phone-title,.cart-title{font-size:16pt}
  </style>
</head>
<body>
  <main>
    <header class="hero"><div><div class="eyebrow">JUJUBIT / TABBAR</div><h1>Tabbar 标签栏</h1></div><a href="https://www.figma.com/design/pVvAxy9wIEWS6KONJ1KzoI/jujubit%E7%BB%84%E4%BB%B6%E5%BA%93?node-id=876-3591" target="_blank" rel="noopener noreferrer">查看 Figma 设计 ↗</a></header>
    <div class="layout">
      <section class="panel phone-panel"><div class="panel-head"><div class="kicker">LIVE PREVIEW</div><h2>手机界面预览</h2><p>点击顶部标签、底部导航或 JUJUBOT，查看页面切换。</p></div><div class="phone-stage"><div class="phone-scale"><div class="phone"><div class="screen"><div class="status"><span>9:41</span><div class="status-right"><img src="./assets/cellular.svg" alt=""><img src="./assets/wifi.svg" alt=""><span class="battery"><img src="./assets/battery-cap.svg" alt=""></span></div></div><div class="phone-content" id="inspirationPage"><div class="phone-title">Inspiration</div><div class="phone-top-tabs" id="phoneTabs"></div><div class="feed"><div class="feed-grid" id="feedGrid"></div></div></div><div class="phone-content" id="cartPage" hidden></div><div class="phone-content" id="myPage" hidden></div><div class="bottom-nav"><button type="button" class="brand-mark bot-trigger" aria-label="打开 JUJUBOT Chat"><img src="./assets/color1-blink.svg" alt=""></button><div class="nav-pill"><span class="nav-selection" aria-hidden="true"></span><button type="button" class="active" data-bottom="Inspiration" aria-pressed="true"><img src="./assets/inspiration-selected.svg" data-active-src="./assets/inspiration-selected.svg" data-inactive-src="./assets/inspiration-default.svg" alt=""><span>Inspiration</span></button><button type="button" data-bottom="Cart" aria-pressed="false"><img src="./assets/cart-default.svg" data-active-src="./assets/cart-selected.svg" data-inactive-src="./assets/cart-default.svg" alt=""><span>Cart</span></button><button type="button" data-bottom="My" aria-pressed="false"><span class="my-slot"><img src="./assets/my.svg" data-active-src="./assets/my-selected.svg" data-inactive-src="./assets/my.svg" alt=""></span><span>My</span></button></div></div><div class="chat-page" id="chatPage" hidden></div></div></div></div></section>
      <section class="panel"><div class="panel-head"><div class="kicker">COMPONENT STYLES</div><h2>样式与状态</h2></div><div class="style-body"><div class="style-block"><div class="style-label"><span>居中对齐</span></div><div class="demo-frame"><div class="demo-tabs center" id="centerTabs"></div></div></div><div class="style-block"><div class="style-label"><span>居左对齐</span></div><div class="demo-frame"><div class="demo-tabs left" id="leftTabs"></div></div></div></div></section>
      <section class="panel"><div class="panel-head"><div class="kicker">SPECIFICATIONS</div><h2>样式参数</h2></div><div class="notes"><div class="note"><strong>14 / 20 px</strong><span>标签字号 / 行高</span></div><div class="note"><strong>400 / 600</strong><span>默认 / 选中字重</span></div><div class="note"><strong>24 × 2 px</strong><span>选中指示线</span></div><div class="note"><strong>12 px</strong><span>标签左右内边距</span></div></div></section>
    </div>
  </main>
  <script>
    const groups={center:{el:document.getElementById('centerTabs'),items:['Product','Details','Protection','Shipping'],selected:'Details'},left:{el:document.getElementById('leftTabs'),items:['For You','Pop','Halloween','TRPG','Anime 1:7','Template'],selected:'Pop'},phone:{el:document.getElementById('phoneTabs'),items:['For You','Pop','Halloween','TRPG','Anime 1:7','Template'],selected:'Pop'}};
    function placeIndicator(group,instant=false){const state=groups[group],active=state.el.querySelector('.text-tab.active'),line=state.el.querySelector('.tab-indicator');if(!active||!line)return;if(instant)line.style.transition='none';line.style.transform=`translateX(${active.offsetLeft+(active.offsetWidth-24)/2}px)`;if(instant)requestAnimationFrame(()=>line.style.removeProperty('transition'))}
    function selectTab(group,label){const state=groups[group];state.selected=label;state.el.querySelectorAll('.text-tab').forEach(button=>{const active=button.dataset.label===label;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});requestAnimationFrame(()=>placeIndicator(group));const selected=[...state.el.querySelectorAll('.text-tab')].find(button=>button.dataset.label===label);if(selected){const x=selected.offsetLeft+selected.offsetWidth/2-state.el.clientWidth/2;state.el.scrollTo({left:x,behavior:'smooth'})}if(group==='left'||group==='phone'){const peer=group==='left'?'phone':'left';groups[peer].selected=label;groups[peer].el.querySelectorAll('.text-tab').forEach(button=>{const active=button.dataset.label===label;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});requestAnimationFrame(()=>placeIndicator(peer))}}
    function render(group){const state=groups[group];const buttons=state.items.map(label=>{const button=document.createElement('button');button.type='button';button.className='text-tab'+(state.selected===label?' active':'');button.dataset.label=label;button.setAttribute('aria-pressed',String(state.selected===label));button.textContent=label;const spacer=document.createElement('span');spacer.setAttribute('aria-hidden','true');button.append(spacer);button.addEventListener('click',()=>{if(state.selected===label)return;selectTab(group,label)});return button});const line=document.createElement('span');line.className='tab-indicator';line.setAttribute('aria-hidden','true');state.el.replaceChildren(...buttons,line);requestAnimationFrame(()=>placeIndicator(group,true))}
    Object.keys(groups).forEach(render);
    function placeNav(pill,instant=false){const active=pill.querySelector('[data-bottom].active'),selection=pill.querySelector('.nav-selection');if(!active||!selection)return;if(instant)selection.style.transition='none';selection.style.width=`${active.offsetWidth}px`;selection.style.transform=`translateX(${active.offsetLeft}px)`;if(instant)requestAnimationFrame(()=>selection.style.removeProperty('transition'))}
    document.querySelectorAll('.nav-pill').forEach(pill=>{pill.querySelectorAll('[data-bottom]').forEach(button=>button.addEventListener('click',()=>{pill.querySelectorAll('[data-bottom]').forEach(item=>{const active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active));const icon=item.querySelector('img');icon.src=active?icon.dataset.activeSrc:icon.dataset.inactiveSrc});requestAnimationFrame(()=>placeNav(pill))}))});
    requestAnimationFrame(()=>document.querySelectorAll('.nav-pill').forEach(pill=>placeNav(pill,true)));
    window.addEventListener('resize',()=>{Object.keys(groups).forEach(group=>placeIndicator(group,true));document.querySelectorAll('.nav-pill').forEach(pill=>placeNav(pill,true))});
    const feed=document.getElementById('feedGrid');for(let i=0;i<8;i++){const card=document.createElement('article');card.className='post';card.innerHTML='<div class="post-art"><img class="shadow" src="./assets/shadow.svg" alt=""><img class="alien" src="./assets/alien.png" alt="戴蓝色帽子的角色模型"></div><div class="post-meta"><span class="avatar" aria-hidden="true"></span><strong>Angelina</strong><span class="likes"><img src="./assets/like.svg" alt="喜欢">23</span></div>';feed.append(card)}
  </script>
  <script src="./pages.js"></script>
</body>
</html>
