ound:#fff;mix-blend-mode:difference}.demo-reglages{display:flex;flex-wrap:wrap;gap:16px}.demo-choix{flex:1 1 300px;border:1px solid var(--trait);border-radius:12px;background:#fff;padding:10px 14px 14px;display:flex;flex-wrap:wrap;gap:6px}.demo-choix legend{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--gris);padding:0 4px}.demo-effets{align-content:flex-start;gap:4px 16px}.demo-effets label{display:inline-flex;align-items:center;gap:6px;color:var(--gris);font-size:13px;cursor:pointer}.demo-export{padding:44px 0 0}.demo-export-reglages{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px}.demo-export-reglages .demo-choix{flex:1 1 190px}.demo-export-mesure{margin:14px 0 0;color:var(--gris);font-size:13px;font-variant-numeric:tabular-nums}.demo-export-note{margin:4px 0 0;min-height:1.5em;font-size:13px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.demo-montage{padding:44px 0 8px}.demo-montage-corps{display:flex;align-items:center;gap:24px;border:1px solid var(--trait);border-radius:12px;background:#fff;padding:12px 20px 12px 12px}.demo-curseur{flex:1 1 auto}.demo-curseur input{width:100%;accent-color:var(--encre)}.demo-curseur p{margin:4px 0 0;color:var(--gris);font-variant-numeric:tabular-nums}.demo-planche{padding:44px 0 0}.demo-planche ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px;list-style:none;margin:0;padding:0}.demo-planche li{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--trait);border-radius:12px;background:#fff;padding:6px 6px 10px}.demo-planche span{font-size:12px;font-weight:550}.demo-planche small{color:var(--gris);font-size:11px;font-variant-numeric:tabular-nums}

    /* Brand resource controls: compact rectangular actions with the JUJUBIT orange accent. */
      .demo{font-family:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .demo button{border-radius:999px;padding:7px 12px}
      .demo button.actif{background:#18181b;border-color:#18181b;color:#fff}
      .demo-choix{border-radius:14px}
      .demo-export-reglages .demo-choix button{border-radius:999px}
      .demo-piste{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:8px}
      .demo-piste li{min-width:0}
      .demo-piste button{display:grid;place-items:center;min-height:44px;padding:8px 10px;white-space:normal}
      .demo-piste button span{overflow:visible;white-space:normal;text-overflow:clip;overflow-wrap:anywhere;line-height:1.4}
      .demo-asset-picker{flex:1 1 100%;display:block}
      .demo-asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
      .demo-asset-grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0;padding:12px 8px;border-radius:16px;background:#fff;color:#18181b}
      .demo-asset-grid button.actif{background:#fff;border:2px solid #18181b;color:#18181b;font-weight:700}
      .demo-asset-grid img{display:block;width:72px;height:72px;object-fit:contain}
      .demo-asset-grid span{font-size:12px;line-height:1.3;text-align:center;white-space:normal}
