/* Keep the icon catalog aligned with the existing brand resource workspace. */
:root{--icon-orange:#ff5a11;color:#111}
.topbar{height:66px;padding:0 clamp(28px,4.1vw,60px);gap:18px;position:relative;border-bottom:1px solid #eee}

.searchbox:focus-within{border-color:var(--icon-orange)}

.intro{align-items:center}.intro .eyebrow{font-size:12px;color:var(--icon-orange);letter-spacing:0;font-weight:600}
.intro h1{color:#000;font-size:clamp(40px,4vw,64px);font-weight:700;line-height:1.13;letter-spacing:-.035em}

.controls{border-radius:16px;background:#f8f8f8;border-color:#eee}

.category-section{border-color:#e6e6e6;border-radius:18px;overflow:hidden}

<body>
  <div class="app">
    <header class="topbar">
      
      <div class="searchbox"><span class="search-icon">⌕</span><input id="search" placeholder="搜索图标、原文件名或规范命名" autocomplete="off" /><kbd>⌘ K</kbd></div>
      <div class="top-actions"><label class="only-selected"><input id="selectedOnly" type="checkbox" /> 只看已选 <em id="selectedCount">0</em></label><div class="view-switch"><button id="gridView" class="active" title="卡片视图">▦</button><button id="tableView" title="表格视图">☷</button></div></div>
    </header>

    <main class="main">
      <section class="content">
        <div class="intro"><div><p class="eyebrow">JUJUBIT / BRAND ASSETS</p><h1>Icon <small>图标资源</small><span id="totalBadge"></span></h1></div><div class="intro-actions"><button id="downloadAll" class="solid" type="button"><span aria-hidden="true">↓</span> 一键下载所有图标 · PNG + SVG</button></div></div>
        <div class="controls" aria-label="图标预览设置"><label class="control-label" for="strokeRange">线宽 <output id="strokeValue">2 px</output></label><input id="strokeRange" type="range" min="1" max="4" step="0.25" value="2" /><label class="control-label" for="sizeInput">图标大小</label><div class="size-input"><input id="sizeInput" type="number" min="16" max="96" step="1" value="48" /><span>pt</span></div><label class="control-label color-label" for="colorPicker">基准颜色</label><input id="colorPicker" type="color" value="#000000" /><input id="hexInput" value="#000000" maxlength="7" aria-label="基准颜色十六进制值" /><span class="control-hint">单色图标可调线宽；彩色素材保持原图</span></div>
        <div class="filters"><div id="categoryFilters" class="chips"></div></div>
        <div class="result-meta"><span id="resultCount"></span><span>点击图标可选中，点击「···」可复制或下载</span></div>
        <div id="loadStatus" class="icon-load-status" role="status">正在加载图标资源…</div>
        <div id="grid" class="sections"></div>
        <div id="tableWrap" class="table-wrap hidden"><table><thead><tr><th>预览</th><th>原文件名</th><th>建议命名</th><th>分类</th><th>类型</th><th>原尺寸</th><th>重绘</th></tr></thead><tbody id="tableBody"></tbody></table></div>
        <div id="empty" class="empty hidden">没有匹配的素材。试试其他关键词或筛选条件。</div>
      </section>
    </main>
    <div id="assetMenu" class="asset-menu hidden" role="menu" aria-label="素材操作"></div>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script>
let DATA = [];
const $ = (id) => document.getElementById(id);
const state = { category: '全部', view: 'grid', selected: new Set(), menuId: null, iconSize: 48, stroke: 2, color: '#000000' };
const categories = ['全部', '基础', '通用', '会员', '社交媒体', 'jujubot', 'logo'];
const words = {action:'操作',nav:'导航',create:'创作',chat:'聊天',order:'订单',vip:'会员',message:'消息',brand:'品牌',illustration:'插画',background:'背景',payment:'支付',feedback:'反馈',avatar:'头像',commerce:'商城',app:'应用',logo:'标识',wordmark:'字标',badge:'徽章',paypal:'PayPal',apple:'Apple',google:'Google',credit:'信用',card:'卡',sf:'顺丰',express:'快递',campaign:'活动',discount:'优惠',package:'包装',box:'盒子',paper:'纸张',carousel:'轮播',step:'节点',done:'完成',doing:'进行中',todo:'待处理',mode:'模式',generating:'生成中',add:'添加',image:'图片',album:'相册',camera:'相机',recent:'最近',arrow:'箭头',white:'白色',black:'黑色',crop:'裁剪',edit:'编辑',back:'返回',dislike:'不喜欢',like:'喜欢',default:'默认',active:'激活',cart:'购物车',shipping:'配送',option:'选项',refine:'精修',muted:'弱化',chevron:'折角',right:'右',left:'左',down:'下',up:'上',close:'关闭',circle:'圆形',copy:'复制',delete:'删除',delivery:'配送',protection:'保障',digital:'数字',crafting:'制作',entry:'入口',email:'邮件',error:'错误',expand:'展开',free:'免运费',location:'定位',magic:'魔法',sparkle:'闪光',more:'更多',horiz:'横向',no:'无需',return:'退货',required:'要求',notification:'通知',pick:'选择',price:'价格',dollar:'美元',quality:'品质',guarantee:'保证',report:'举报',send:'发送',share:'分享',success:'成功',failed:'失败',star:'星星',style:'样式',tab:'标签栏',inspire:'灵感',profile:'我的',template:'模板',grid:'网格',selected:'选中',unselected:'未选中',transparent:'透明',customization:'定制',attention:'注意',coupon:'优惠券',watermark:'水印',disabled:'禁用',plan:'方案',basic:'基础',premium:'高级',pro:'专业',upgrade:'升级',mark:'标记',all:'全部',read:'已读',enabled:'启用',settings:'设置',show:'查看',detail:'详情',empty:'空状态',purchase:'购买',header:'头图',greeting:'欢迎',glow:'光晕',title:'标题',product:'产品',size:'尺寸',compare:'对比',guide:'指南',subjects:'主体',explanation:'说明',anime:'动漫',dnd:'奇幻',funko:'潮玩',contact:'联系',us:'我们',shipped:'已发货',refinement:'精修',standard:'标准',deco:'装饰',ellipse:'椭圆',union:'组合',bordered:'描边',bg:'背景',btn:'按钮',face:'表情',status:'状态',tips:'提示',system:'系统',billing:'账单',check:'勾选',in:'放大',out:'缩小'};
const chineseOverrides = {'icon-bg-white':'背景 · white','brand-app-logo':'应用图标','brand-jujubit-wordmark':'JUJUBIT 字标','brand-jujubot-wordmark':'JujuBot 字标','brand-jujubit-badge':'JUJUBIT 徽章','create-mode-2d':'2D 模式','create-mode-3d':'3D 模式','create-2d-black':'2D 切换','create-3d-black':'3D 切换','order-carousel-done':'轮播 · 已完成','order-carousel-todo':'轮播 · 待处理','order-step-doing':'履约节点 · 进行中','order-step-done':'履约节点 · 已完成','order-step-todo':'履约节点 · 待处理','feedback-like-default':'喜欢 · 默认','feedback-like-active':'喜欢 · 激活','feedback-dislike-default':'不喜欢 · 默认','feedback-dislike-active':'不喜欢 · 激活','nav-tab-cart':'底部导航 · 购物车','nav-tab-inspire':'底部导航 · 灵感','nav-tab-profile':'底部导航 · 我的'};
function displayName(r) { return chineseOverrides[r.name] || r.name.split('-').slice(1).map((x) => words[x] || x).join(' · '); }

function toast(message) {
  const el = $('toast'); el.textContent = message; el.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove('show'), 2200);
}

async function copy(text, message) {
  try { await navigator.clipboard.writeText(text); toast(message); }
  catch { const area = document.createElement('textarea'); area.value = text; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove(); toast(message); }
}

function filtered() {
  const q = $('search').value.trim().toLowerCase();
  return DATA.filter((r) =>
    (state.category === '全部' || r.category === state.category) &&
    (!$('selectedOnly').checked || state.selected.has(r.id)) &&
    (!q || [r.original, r.name, r.category, r.type, displayName(r)].some((x) => x.toLowerCase().includes(q)))
  );
}

function renderFilters() {
  $('categoryFilters').replaceChildren(...categories.map((cat) => {
    const btn = document.createElement('button'); btn.className = 'chip' + (state.category === cat ? ' active' : '');
    btn.textContent = `${cat} ${cat === '全部' ? DATA.length : DATA.filter((r) => r.category === cat).length}`;
    btn.onclick = () => { state.category = cat; render(); }; return btn;
  }));
}

function imagePath(r) {
  if (!r.path) r.path = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(r.svg);
  return r.path;
}
function rowImage(r) { return `<img src="${imagePath(r)}" alt="${r.original}" loading="lazy">`; }
function isVector(r){return r.format==='SVG' && !!r.svg;}
function editableVector(r){return isVector(r) && r.vector && !/#FF5A11|\bwhite\b|#1F1F1F/i.test(r.svg);}
function configuredSvg(r){
  if(!isVector(r))return null;
  if(!editableVector(r))return r.svg;
  return r.svg.replace(/(stroke|fill)="black"/g,(_,attr)=>`${attr}="${state.color}"`)
    .replace(/stroke-width="([\d.]+)"/g,(_,value)=>`stroke-width="${(Number(value)*state.stroke/2).toFixed(2)}"`);
}
function shouldRenderMono(r){return r.monochrome && r.type==='图标' && !['icon_arrow_white.png','icon_close_white.png','icon_circle_close_wt.png','icon_add_image_wt.png','icon_pick_image_wt.png','icon_send_arrow_wt.png','icon_ai_chat_recent_camera_wt.png','icon_template_select_off.png','show_detail.png'].includes(r.original);}

const imageCache = new Map();
let previewRevision = 0;
function imageFor(r) {
  if (!imageCache.has(r.id)) imageCache.set(r.id, new Promise((resolve, reject) => {
    const image = new Image(); image.onload = () => resolve(image); image.onerror = reject; image.src = imagePath(r);
  }));
  return imageCache.get(r.id);
}

async function monoCanvas(r, settings={size:state.iconSize, stroke:state.stroke, color:state.color}) {
  const size = settings.size;
  const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
  const context = canvas.getContext('2d', {willReadFrequently:true});
  const image = await imageFor(r);
  const scale = Math.min((size*.76) / image.width, (size*.76) / image.height);
  const width=image.width*scale, height=image.height*scale;
  context.drawImage(image,(size-width)/2,(size-height)/2,width,height);
  const frame=context.getImageData(0,0,size,size), pixels=frame.data;
  const source=new Uint8ClampedArray(size*size);
  for(let i=0;i<source.length;i++) source[i]=pixels[i*4+3];
  const delta=settings.stroke===2?0:(settings.stroke>2?Math.max(1,Math.round((settings.stroke-2)*size/18)):-Math.max(1,Math.round((2-settings.stroke)*size/18)));
  const radius=Math.min(3,Math.abs(delta));
  const [red,green,blue]=[1,3,5].map((start)=>parseInt(settings.color.slice(start,start+2),16));
  for(let y=0;y<size;y++) for(let x=0;x<size;x++) {
    let alpha=source[y*size+x];
    if(radius){
      alpha=delta>0?0:255;
      for(let dy=-radius;dy<=radius;dy++) for(let dx=-radius;dx<=radius;dx++) {
        if(dx*dx+dy*dy>radius*radius)continue;
        const xx=x+dx, yy=y+dy;
        const neighbor=xx>=0&&xx<size&&yy>=0&&yy<size?source[yy*size+xx]:0;
        alpha=delta>0?Math.max(alpha,neighbor):Math.min(alpha,neighbor);
      }
    }
    const index=(y*size+x)*4;
    pixels[index]=red;pixels[index+1]=green;pixels[index+2]=blue;pixels[index+3]=alpha;
  }
  context.putImageData(frame,0,0); return canvas;
}

function renderMonoPreviews(rows) {
  const revision=++previewRevision;
  rows.filter(isVector).forEach((r)=>{
    const target=document.querySelector(`[data-vector="${r.id}"]`);
    if(target){const svg=configuredSvg(r);target.innerHTML=svg;}
  });
  rows.filter(shouldRenderMono).forEach(async (r)=>{
    try {
      const canvas=await monoCanvas(r);
      if(revision!==previewRevision)return;
      const target=document.querySelector(`[data-mono="${r.id}"]`);
      if(target)target.replaceChildren(canvas);
    } catch { const target=document.querySelector(`[data-mono="${r.id}"]`); if(target)target.innerHTML=rowImage(r); }
  });
}

function renderGrid(rows) {
  const visibleCategories = categories.slice(1).filter((category) => rows.some((r) => r.category === category));
  $('grid').innerHTML = visibleCategories.map((category) => {
    const items = rows.filter((r) => r.category === category);
    return `<section class="category-section"><header class="section-heading"><h2>${category}</h2><span>${items.length}</span></header><div class="icon-matrix">${items.map((r) => `<article class="card ${state.selected.has(r.id) ? 'selected' : ''}" data-id="${r.id}" title="原文件：${r.original}\n尺寸：${r.width}×${r.height}"><div class="card-text"><strong title="${displayName(r)}">${displayName(r)}</strong><div class="newname" data-copy="${r.name}" title="点击复制规范名称">${r.name}</div></div><div class="preview ${r.type === '背景' || r.type === '插画/图片' ? 'large' : ''} ${r.name.endsWith('-white') || r.name.endsWith('-unselected') ? 'preview-white' : ''}">${isVector(r) ? `<span class="vector-preview" data-vector="${r.id}"></span>` : shouldRenderMono(r) ? `<span class="mono-preview" data-mono="${r.id}"></span>` : rowImage(r)}</div><button class="card-more" data-menu="${r.id}" type="button" aria-label="${displayName(r)}的更多操作" aria-haspopup="menu" aria-expanded="${state.menuId === r.id}">···</button></article>`).join('')}</div></section>`;
  }).join('');
  $('grid').style.setProperty('--icon-size', `${state.iconSize}px`);
  renderMonoPreviews(rows);
}

function renderTable(rows) {
  $('tableBody').innerHTML = rows.map((r) => `<tr><td>${rowImage(r)}</td><td>${r.original}</td><td class="name-cell" data-copy="${r.name}" title="点击复制">${r.name}</td><td>${r.category}</td><td>${r.type}</td><td>${r.width}×${r.height}</td><td><input class="tiny-check" data-id="${r.id}" type="checkbox" ${state.selected.has(r.id) ? 'checked' : ''} ${r.redraw ? '' : 'title="非优先重绘项"'}></td></tr>`).join('');
}

function render() {
  const rows = filtered(); renderFilters(); $('totalBadge').textContent = DATA.length; renderGrid(rows); renderTable(rows);
  $('resultCount').textContent = `显示 ${rows.length} / ${DATA.length} 项`;
  $('selectedCount').textContent = `${state.selected.size}/${DATA.length}`;
  $('grid').classList.toggle('hidden', state.view !== 'grid' || rows.length === 0);
  $('tableWrap').classList.toggle('hidden', state.view !== 'table' || rows.length === 0);
  $('empty').classList.toggle('hidden', rows.length !== 0);
  $('gridView').classList.toggle('active', state.view === 'grid'); $('tableView').classList.toggle('active', state.view === 'table');
}

function tsv(rows) {
  return ['原文件名\t规范命名\t分类\t类型\t尺寸\t格式\t建议重绘', ...rows.map((r) => [r.original, r.name, r.category, r.type, `${r.width}×${r.height}`, r.format, r.redraw ? '是' : '否'].join('\t'))].join('\n');
}

function csv(rows) {
  const esc = (x) => `"${String(x).replaceAll('"', '""')}"`;
  return '\ufeff' + [['原文件名','规范命名','分类','类型','宽','高','格式','建议重绘'], ...rows.map((r) => [r.original,r.name,r.category,r.type,r.width,r.height,r.format,r.redraw ? '是' : '否'])].map((row) => row.map(esc).join(',')).join('\r\n');
}

function closeMenu() {
  state.menuId = null; $('assetMenu').classList.add('hidden');
  document.querySelectorAll('.card-more[aria-expanded="true"]').forEach((button) => button.setAttribute('aria-expanded', 'false'));
}

function openMenu(id, anchor) {
  if (state.menuId === id) { closeMenu(); return; }
  state.menuId = id;
  document.querySelectorAll('.card-more').forEach((button) => button.setAttribute('aria-expanded', String(button.dataset.menu === id)));
  const menu = $('assetMenu');
  const row=DATA.find((r)=>r.id===id),hint=isVector(row)?row.vector?'真实矢量':'设计稿含位图':'内嵌位图';
  menu.innerHTML = `<div class="menu-heading">图标操作</div><button data-action="copy-name" role="menuitem">复制英文名称</button><button data-action="copy-svg" role="menuitem">复制 SVG <small>${hint}</small></button><button data-action="copy-react" role="menuitem">复制 React 代码 <small>${hint}</small></button><button data-action="copy-vue" role="menuitem">复制 Vue 代码 <small>${hint}</small></button><button data-action="copy-png" role="menuitem">复制 PNG</button><div class="menu-divider"></div><button data-action="download-svg" role="menuitem">下载 SVG <small>${hint}</small></button><button data-action="download-png" role="menuitem">下载 PNG</button>`;
  menu.classList.remove('hidden');
  const rect = anchor.getBoundingClientRect();
  const menuWidth = 252, menuHeight = menu.getBoundingClientRect().height;
  menu.style.left = `${Math.max(8, Math.min(rect.right - menuWidth, innerWidth - menuWidth - 8))}px`;
  menu.style.top = `${rect.bottom + menuHeight + 8 <= innerHeight ? rect.bottom + 6 : Math.max(8, rect.top - menuHeight - 6)}px`;
}

async function assetData(r) {
  const response = await fetch(imagePath(r));
  if (!response.ok) throw new Error('素材读取失败');
  const blob = await response.blob();
  const bytes = new Uint8Array(await blob.arrayBuffer());
  let binary = ''; for (let i=0; i<bytes.length; i+=0x8000) binary += String.fromCharCode(...bytes.subarray(i,i+0x8000));
  return { blob, uri: `data:${blob.type || 'image/png'};base64,${btoa(binary)}` };
}

function embeddedSvg(r, uri) {
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${r.width}" height="${r.height}" viewBox="0 0 ${r.width} ${r.height}"><image width="${r.width}" height="${r.height}" href="${uri}" xlink:href="${uri}"/></svg>`;
}

async function pngBlob(r) {
  if(isVector(r)){
    const url=URL.createObjectURL(new Blob([configuredSvg(r)],{type:'image/svg+xml;charset=utf-8'}));
    let image;
    try {
      image=await new Promise((resolve,reject)=>{
        const element=new Image();
        element.onload=()=>resolve(element);
        element.onerror=()=>reject(new Error('SVG 图标无法转换为 PNG'));
        element.src=url;
      });
    } finally { URL.revokeObjectURL(url); }
    const canvas=document.createElement('canvas');canvas.width=state.iconSize;canvas.height=state.iconSize;
    canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
    return await new Promise((resolve,reject)=>canvas.toBlob((result)=>result?resolve(result):reject(new Error('PNG 转换失败')),'image/png'));
  }
  const response = await fetch(imagePath(r)); if (!response.ok) throw new Error('素材读取失败');
  const blob = await response.blob(); if (blob.type === 'image/png') return blob;
  const image = await createImageBitmap(blob); const canvas = document.createElement('canvas');
  canvas.width=r.width; canvas.height=r.height; canvas.getContext('2d').drawImage(image,0,0); image.close();
  return await new Promise((resolve, reject) => canvas.toBlob((result) => result ? resolve(result) : reject(new Error('PNG 转换失败')), 'image/png'));
}

function downloadBlob(blob, filename) {
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function menuAction(action, r) {
  if(action==='copy-name'){await copy(r.name,'英文名称已复制');return;}
  const label = {'copy-svg':'SVG','copy-react':'React 代码','copy-vue':'Vue 代码','copy-png':'PNG','download-svg':'SVG','download-png':'PNG'}[action];
  if (action.endsWith('png')) {
    const blob = shouldRenderMono(r) ? await new Promise((resolve,reject)=>monoCanvas(r).then((canvas)=>canvas.toBlob((value)=>value?resolve(value):reject(new Error('PNG 生成失败')),'image/png')).catch(reject)) : await pngBlob(r);
    if (action.startsWith('download')) downloadBlob(blob, `${r.name}.png`);
    else {
      if (!navigator.clipboard?.write || !window.ClipboardItem) throw new Error('当前浏览器不支持复制图片，请使用下载 PNG');
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    }
  } else {
    if(isVector(r)){
      const svg=configuredSvg(r);
      if(action==='copy-svg')await copy(svg,r.vector?'已复制真实矢量 SVG':'已复制设计稿 SVG');
      if(action==='download-svg')downloadBlob(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),`${r.name}.svg`);
      if(action==='copy-react')await copy(`export default function Icon({ size = 48, ...props }) {\n  return <span style={{ display: 'inline-flex', width: size, height: size }} {...props} dangerouslySetInnerHTML={{ __html: ${JSON.stringify(svg)} }} />;\n}`, '已复制 React 代码');
      if(action==='copy-vue')await copy(`<template><span :style="{ display: 'inline-flex', width: size + 'px', height: size + 'px' }" v-html="svg" /></template>\n<script setup>\nconst svg = ${JSON.stringify(svg)};\ndefineProps({ size: { type: Number, default: 48 } });\n<\/script>`, '已复制 Vue 代码');
      if(action.startsWith('download'))toast(`已下载 ${label}${r.vector?'（真实矢量）':'（设计稿含位图）'}`);
      return;
    }
    const {uri} = shouldRenderMono(r) ? await (async()=>{const blob=await new Promise((resolve,reject)=>monoCanvas(r).then((canvas)=>canvas.toBlob((value)=>value?resolve(value):reject(new Error('PNG 生成失败')),'image/png')).catch(reject));return {uri:await blobToDataUri(blob)};})() : await assetData(r);
    const exportRow=shouldRenderMono(r)?{...r,width:state.iconSize,height:state.iconSize}:r;
    const svg = embeddedSvg(exportRow,uri);
    if (action === 'copy-svg') await copy(svg, '已复制 SVG（内嵌原始位图）');
    if (action === 'download-svg') downloadBlob(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),`${r.name}.svg`);
    if (action === 'copy-react') await copy(`export default function Icon({ size = ${Math.max(exportRow.width,exportRow.height)}, ...props }) {\n  return (\n    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size * ${exportRow.height} / ${exportRow.width}} viewBox="0 0 ${exportRow.width} ${exportRow.height}" {...props}>\n      <image width="${exportRow.width}" height="${exportRow.height}" href="${uri}" />\n    </svg>\n  );\n}`, '已复制 React 代码（内嵌位图）');
    if (action === 'copy-vue') await copy(`<template>\n  <svg xmlns="http://www.w3.org/2000/svg" :width="size" :height="size * ${exportRow.height} / ${exportRow.width}" viewBox="0 0 ${exportRow.width} ${exportRow.height}">\n    <image width="${exportRow.width}" height="${exportRow.height}" href="${uri}" />\n  </svg>\n</template>\n\n<script setup>\ndefineProps({ size: { type: Number, default: ${Math.max(exportRow.width,exportRow.height)} } })\n<\/script>`, '已复制 Vue 代码（内嵌位图）');
  }
  if (action.startsWith('download')) toast(`已下载 ${label}（原始位图）`);
  else if (action === 'copy-png') toast('已复制 PNG');
}

function blobToDataUri(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);});}

const zipEncoder = new TextEncoder();
const crcTable = Array.from({length:256},(_,index)=>{let value=index;for(let bit=0;bit<8;bit++)value=(value&1)?(0xedb88320^(value>>>1)):(value>>>1);return value>>>0;});
function crc32(bytes){let crc=0xffffffff;for(const byte of bytes)crc=crcTable[(crc^byte)&255]^(crc>>>8);return (crc^0xffffffff)>>>0;}
function zipArchive(files){
  const parts=[],directory=[];let offset=0;
  for(const file of files){
    const name=zipEncoder.encode(file.name),data=file.data,crc=crc32(data);
    const local=new Uint8Array(30+name.length),view=new DataView(local.buffer);
    view.setUint32(0,0x04034b50,true);view.setUint16(4,20,true);view.setUint16(6,0x0800,true);
    view.setUint32(14,crc,true);view.setUint32(18,data.length,true);view.setUint32(22,data.length,true);view.setUint16(26,name.length,true);local.set(name,30);
    parts.push(local,data);
    const central=new Uint8Array(46+name.length),entry=new DataView(central.buffer);
    entry.setUint32(0,0x02014b50,true);entry.setUint16(4,20,true);entry.setUint16(6,20,true);entry.setUint16(8,0x0800,true);
    entry.setUint32(16,crc,true);entry.setUint32(20,data.length,true);entry.setUint32(24,data.length,true);entry.setUint16(28,name.length,true);entry.setUint32(42,offset,true);central.set(name,46);
    directory.push(central);offset+=local.length+data.length;
  }
  const directorySize=directory.reduce((sum,entry)=>sum+entry.length,0),end=new Uint8Array(22),view=new DataView(end.buffer);
  view.setUint32(0,0x06054b50,true);view.setUint16(8,files.length,true);view.setUint16(10,files.length,true);view.setUint32(12,directorySize,true);view.setUint32(16,offset,true);
  return new Blob([...parts,...directory,end],{type:'application/zip'});
}

async function downloadAllIcons(){
  const button=$('downloadAll'),originalLabel=button.innerHTML;
  button.disabled=true;const files=[];
  try{
    for(let index=0;index<DATA.length;index++){
      const row=DATA[index],png=shouldRenderMono(row)?await new Promise((resolve,reject)=>monoCanvas(row).then((canvas)=>canvas.toBlob((blob)=>blob?resolve(blob):reject(new Error('PNG 生成失败')),'image/png')).catch(reject)):await pngBlob(row);
      const bytes=new Uint8Array(await png.arrayBuffer());
      const dataUri=isVector(row)?null:await blobToDataUri(png);
      const exportRow=shouldRenderMono(row)?{...row,width:state.iconSize,height:state.iconSize}:row;
      files.push({name:`PNG/${row.name}.png`,data:bytes});
      files.push({name:`SVG/${row.name}.svg`,data:zipEncoder.encode(isVector(row)?configuredSvg(row):embeddedSvg(exportRow,dataUri))});
      if(index%8===0||index===DATA.length-1){button.textContent=`正在打包 ${index+1}/${DATA.length}`;await new Promise((resolve)=>requestAnimationFrame(resolve));}
    }
    const figmaRows=DATA.filter((row)=>row.figma),pureVectors=figmaRows.filter((row)=>row.vector);
    const note=`JUJUBIT 图标与素材导出\n\n目录包含 ${DATA.length} 项，其中 ${figmaRows.length} 项来自 Figma 重绘稿。${pureVectors.length} 项为真实矢量 SVG，${figmaRows.length-pureVectors.length} 项设计稿素材内嵌位图。其余素材采用原文件，其 SVG 为内嵌位图。PNG 按当前预览参数导出。彩色图标保留设计稿配色。\n`;
    files.push({name:'README.txt',data:zipEncoder.encode(note)});
    downloadBlob(zipArchive(files),'jujubit-all-icons-png-svg.zip');
    toast(`已打包 ${DATA.length} 项 PNG + SVG`);
  }catch(error){toast(error.message||'打包失败');}
  finally{button.disabled=false;button.innerHTML=originalLabel;}
}

['search','selectedOnly'].forEach((id) => $(id).addEventListener(id === 'search' ? 'input' : 'change', render));
$('gridView').onclick = () => { state.view = 'grid'; render(); };
$('tableView').onclick = () => { state.view = 'table'; render(); };
$('grid').onclick = (e) => {
  const more = e.target.closest('[data-menu]'); if (more) { openMenu(more.dataset.menu, more); return; }
  const target = e.target.closest('[data-copy]'); if (target) { copy(target.dataset.copy, '规范名称已复制'); return; }
  const card = e.target.closest('.card'); if (!card) return;
  state.selected.has(card.dataset.id) ? state.selected.delete(card.dataset.id) : state.selected.add(card.dataset.id); closeMenu(); render();
};
$('assetMenu').onclick = async (e) => {
  const button = e.target.closest('[data-action]'); if (!button) return;
  const r = DATA.find((row) => row.id === state.menuId); const action=button.dataset.action; closeMenu();
  if (!r) return;
  try { await menuAction(action,r); } catch (err) { toast(err.message || '操作失败'); }
};
document.addEventListener('click', (e) => { if (!e.target.closest('.asset-menu, .card-more')) closeMenu(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
$('tableBody').onclick = (e) => { const target = e.target.closest('[data-copy]'); if (target) copy(target.dataset.copy, '规范名称已复制'); };
$('tableBody').onchange = (e) => { const input = e.target.closest('[data-id]'); if (!input) return; input.checked ? state.selected.add(input.dataset.id) : state.selected.delete(input.dataset.id); render(); };
$('downloadAll').onclick=downloadAllIcons;
$('sizeInput').oninput = (e) => {const value=Number(e.target.value);if(value>=16&&value<=96){state.iconSize=value;render();}};
$('strokeRange').oninput = (e) => {state.stroke=Number(e.target.value);$('strokeValue').textContent=`${state.stroke} px`;render();};
$('colorPicker').oninput = (e) => {state.color=e.target.value.toUpperCase();$('hexInput').value=state.color;render();};
$('hexInput').oninput = (e) => {if(/^#[\da-fA-F]{6}$/.test(e.target.value)){state.color=e.target.value.toUpperCase();$('colorPicker').value=state.color;render();}};
document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); $('search').focus(); } });
const dataScript = document.createElement('script');
dataScript.src = './data.js';
dataScript.async = true;
dataScript.onload = () => {
  DATA = window.ICON_DATA || [];
  $('loadStatus').classList.add('hidden');
  render();
};
dataScript.onerror = () => {
  $('loadStatus').textContent = '图标资源加载失败，请刷新页面重试。';
};
document.head.appendChild(dataScript);

</script>
